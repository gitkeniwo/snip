# Curated semantic roles for the generated default theme. The generator treats
# bar_bg as the unadjusted surface source and computes both bar/pill surfaces
# against light-default's assumed terminal canvas.
schema_version = 1
name = "light-default"
display_name = "Default Light"
appearance = "light"
source = "builtin"

[ui]
background = "terminal"
foreground = "terminal"
accent = "#0969da"
accent_alt = "#7d3ddb"
border = "#6e7781"
muted = "#57606a"
selection_bg = "#0550ae"
selection_fg = "white"
retained_bg = "#e6f0fb"
pill_primary = "#0757ba"
pill_secondary = "terminal"
bar_bg = "#f6f8fa"
bar_fg = "#24292f"
tag = "#8f6100"
rule = "#d0d7de"
success = "#136f2f"
warning = "#ad4600"
error = "#cf222e"

[syntax]
theme = "InspiredGithub"
