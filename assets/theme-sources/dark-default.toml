# Curated semantic roles for the generated default theme. The generator treats
# bar_bg as the unadjusted surface source and computes both bar/pill surfaces
# against dark-default's assumed terminal canvas.
schema_version = 1
name = "dark-default"
display_name = "Default Dark"
appearance = "dark"
source = "builtin"

[ui]
background = "terminal"
foreground = "terminal"
accent = "#58a6ff"
accent_alt = "#d2a8ff"
border = "#6e7681"
muted = "#8b949e"
selection_bg = "#1158c7"
selection_fg = "white"
retained_bg = "#0c2d6b"
pill_primary = "#1f6feb"
pill_secondary = "terminal"
bar_bg = "#24292f"
bar_fg = "#dadfe4"
tag = "#e3b341"
rule = "#444c56"
success = "#3fb950"
warning = "#f0883e"
error = "#f85149"

[syntax]
theme = "Base16OceanDark"
