name: CI

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  install-script:
    name: install script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck --shell=sh install.sh
      - run: sh -n install.sh
      - run: sh install.sh --help

  quality:
    name: quality (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-stable-full
            os: ubuntu-24.04
            toolchain: stable
            cargo_args: --all-features
          - name: linux-msrv-full
            os: ubuntu-24.04
            toolchain: 1.89.0
            cargo_args: --all-features
          - name: linux-stable-slim
            os: ubuntu-24.04
            toolchain: stable
            cargo_args: --no-default-features
          - name: macos-arm64-full
            os: macos-latest
            toolchain: stable
            cargo_args: --all-features
          - name: windows-stable-full
            os: windows-latest
            toolchain: stable
            cargo_args: --all-features
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked ${{ matrix.cargo_args }}
      - name: Check generated man pages
        if: matrix.name == 'linux-msrv-full'
        run: cargo run --locked --all-features --example generate-man -- --check
      - name: Check generated themes
        if: matrix.name == 'linux-msrv-full'
        run: cargo run --locked --all-features --example generate-themes -- --check
      - name: Check generated key reference
        if: matrix.name == 'linux-msrv-full'
        run: cargo run --locked --all-features --example generate-keys-doc -- --check
      - name: Lint man pages
        if: matrix.name == 'macos-arm64-full'
        # clap_mangen emits constructs that mandoc flags as style warnings.
        # Parse every page while failing only on syntax errors or worse.
        run: mandoc -W error -T utf8 man/*.1 > /dev/null
