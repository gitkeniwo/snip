name: CI

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  install-script:
    name: install script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck --shell=sh install.sh
      - run: sh -n install.sh
      - run: sh install.sh --help

  packaging:
    name: packaging templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check Gentoo templates
        run: |
          bash -n packaging/gentoo/ebuild-bin.in
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ebuild = Path("packaging/gentoo/ebuild-bin.in").read_text().splitlines()
          if not ebuild[0].startswith("# Copyright "):
              raise SystemExit("Gentoo ebuild must start with its copyright header")
          if not ebuild[1].startswith("# Distributed under the terms of "):
              raise SystemExit("Gentoo ebuild must keep its license header second")

          ET.parse("packaging/gentoo/metadata.xml.in")

          layout = {}
          for line in Path("packaging/gentoo/layout.conf.in").read_text().splitlines():
              line = line.strip()
              if line and not line.startswith("#"):
                  key, value = line.split("=", 1)
                  layout[key.strip()] = value.strip()

          expected = {
              "masters": "gentoo",
              "repo-name": "snip",
              "thin-manifests": "true",
              "sign-manifests": "false",
              "use-manifests": "strict",
              "manifest-hashes": "BLAKE2B SHA512",
          }
          if layout != expected:
              raise SystemExit(f"unexpected Gentoo layout.conf: {layout!r}")
          PY

  quality:
    name: quality (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-stable-full
            os: ubuntu-24.04
            toolchain: stable
            cargo_args: --all-features
          - name: linux-msrv-full
            os: ubuntu-24.04
            toolchain: 1.89.0
            cargo_args: --all-features
          - name: linux-stable-slim
            os: ubuntu-24.04
            toolchain: stable
            cargo_args: --no-default-features
          - name: macos-arm64-full
            os: macos-latest
            toolchain: stable
            cargo_args: --all-features
          - name: windows-stable-full
            os: windows-latest
            toolchain: stable
            cargo_args: --all-features
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked ${{ matrix.cargo_args }}
      - name: Build and verify the Windows release binary
        if: matrix.name == 'windows-stable-full'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release --all-features
          .\target\release\snip.exe --version
          .\.github\scripts\check-windows-crt.ps1 -Executable target\release\snip.exe
      - name: Check generated man pages
        if: matrix.name == 'linux-msrv-full'
        run: cargo run --locked --all-features --example generate-man -- --check
      - name: Test man page generator
        if: matrix.name == 'linux-msrv-full'
        run: cargo test --locked --all-features --example generate-man
      - name: Check generated themes
        if: matrix.name == 'linux-msrv-full'
        run: cargo run --locked --all-features --example generate-themes -- --check
      - name: Check generated key reference
        if: matrix.name == 'linux-msrv-full'
        run: cargo run --locked --all-features --example generate-keys-doc -- --check
      - name: Lint man pages
        if: matrix.name == 'macos-arm64-full'
        # clap_mangen emits constructs that mandoc flags as style warnings.
        # Parse every page while failing only on syntax errors or worse.
        run: mandoc -W error -T utf8 man/*.[157] > /dev/null
