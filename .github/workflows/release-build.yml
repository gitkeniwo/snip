name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  version:
    name: Check tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.check.outputs.crate }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          crate="$(echo "$metadata" | jq -r '.packages[0].name')"
          version="$(echo "$metadata" | jq -r '.packages[0].version')"
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $crate $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: snip-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: snip-aarch64-unknown-linux-gnu
          - os: macos-latest
            asset: snip-aarch64-apple-darwin
          - os: macos-15-intel
            asset: snip-x86_64-apple-darwin
          - os: windows-latest
            asset: snip-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.asset }}
      - run: cargo build --locked --release --all-features
      - run: ./target/release/snip --version
        if: runner.os != 'Windows'
      - run: .\target\release\snip.exe --version
        if: runner.os == 'Windows'
      - name: Install Linux package builders
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --version 3.7.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
      - name: Create portable archive (Unix)
        if: runner.os != 'Windows'
        run: |
          stage="$RUNNER_TEMP/snip-archive"
          mkdir -p "$stage/man"
          cp target/release/snip "$stage/snip"
          cp man/*.1 "$stage/man/"
          tar -C "$stage" -czf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" snip man
      - name: Verify portable archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -tzf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" |
            grep -qx 'man/snip.1'
      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/snip.exe -DestinationPath ${{ matrix.asset }}.zip
      - name: Create Linux packages
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build --output ${{ matrix.asset }}.deb
          cargo generate-rpm -o ${{ matrix.asset }}.rpm
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*.tar.gz
            artifacts/*/*.zip
            artifacts/*/*.deb
            artifacts/*/*.rpm
          generate_release_notes: true

  crates-io:
    name: Publish to crates.io
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CRATE: ${{ needs.version.outputs.crate }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check for a registry token
        id: guard
        env:
          REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code="$(curl -sSL -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          if [ "$code" = "200" ]; then
            echo "$CRATE $VERSION is already on crates.io; nothing to publish." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.ready == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          key: crates-io
      - name: Publish
        if: steps.guard.outputs.ready == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --all-features

  tap:
    name: Update Homebrew tap
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check for a tap token
        id: guard
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          path: artifacts

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          repository: gitkeniwo/homebrew-snip
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Rewrite the formula
        if: steps.guard.outputs.ready == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, sys

          version = os.environ["VERSION"].lstrip("v")
          sums = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path("artifacts").rglob("snip-*.tar.gz")
          }
          if not sums:
              sys.exit("no release archives were downloaded")

          formula = pathlib.Path("tap/Formula/snip.rb")
          text = re.sub(
              r"/releases/download/v[^/]+/",
              f"/releases/download/v{version}/",
              formula.read_text(),
          )

          missing = []

          def swap(match):
              asset = match.group("asset")
              if asset not in sums:
                  missing.append(asset)
                  return match.group(0)
              return match.group(1) + sums[asset] + match.group(3)

          text, count = re.subn(
              r'(url "[^"]*/(?P<asset>snip-[^"/]+\.tar\.gz)"\n\s*sha256 ")'
              r'[0-9a-f]{64}(")',
              swap,
              text,
          )

          if missing:
              sys.exit("no release archive for: " + ", ".join(missing))
          if count != len(sums):
              sys.exit(f"rewrote {count} platforms but built {len(sums)} archives")

          formula.write_text(text)
          print(f"updated {count} platforms to {version}")
          PY

      - name: Commit and push
        if: steps.guard.outputs.ready == 'true'
        working-directory: tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "Formula was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "snip ${VERSION#v}"
          git push

  scoop:
    name: Update Scoop bucket
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check for a bucket token
        id: guard
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$BUCKET_TOKEN" ]; then
            echo "SCOOP_BUCKET_TOKEN is not set; skipping the Scoop bucket update." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/download-artifact@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          name: snip-x86_64-pc-windows-msvc
          path: artifacts

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          repository: gitkeniwo/scoop-snip
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket-repo

      - name: Render the manifest
        if: steps.guard.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          version = os.environ["VERSION"]
          archive = Path("artifacts/snip-x86_64-pc-windows-msvc.zip")
          if not archive.is_file():
              sys.exit(f"{archive} was not downloaded")

          manifest = Path("packaging/scoop/snip.json.in").read_text()
          manifest = manifest.replace("@VERSION@", version)
          manifest = manifest.replace(
              "@SHA256@", hashlib.sha256(archive.read_bytes()).hexdigest()
          )

          # Parse before writing so a malformed template fails the release
          # rather than shipping a manifest Scoop cannot read.
          json.loads(manifest)

          out = Path("bucket-repo/bucket/snip.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(manifest)
          print(f"rendered snip.json for {version}")
          PY

      - name: Commit and push
        if: steps.guard.outputs.ready == 'true'
        working-directory: bucket-repo
        run: |
          git add bucket/snip.json
          if git diff --cached --quiet; then
            echo "Scoop manifest was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "snip release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "snip $VERSION"
          git push

  aur:
    name: Update AUR package
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUR_PACKAGE: sniplab
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for an AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set; cannot publish to the AUR."
            exit 1
          fi

      - name: Configure SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone the AUR repository
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: git -c init.defaultBranch=master clone ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git aur

      - name: Render PKGBUILD and .SRCINFO
        env:
          SOURCE_URL: https://github.com/gitkeniwo/snip/archive/refs/tags/v${{ needs.version.outputs.version }}.tar.gz
        run: |
          curl --fail --location --retry 3 --output source.tar.gz "$SOURCE_URL"
          checksum="$(sha256sum source.tar.gz | cut -d ' ' -f 1)"
          export CHECKSUM="$checksum"
          python3 - <<'PY'
          import os
          from pathlib import Path

          template = Path("packaging/aur/PKGBUILD.in").read_text()
          package = template.replace("@VERSION@", os.environ["VERSION"])
          package = package.replace("@SHA256@", os.environ["CHECKSUM"])
          Path("aur/PKGBUILD").write_text(package)
          PY
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD/aur:/pkg" \
            --workdir /pkg \
            archlinux:base-devel \
            bash -lc 'makepkg --printsrcinfo' > aur/.SRCINFO

      - name: Commit and push
        working-directory: aur
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "snip release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "snip $VERSION"
          git push origin HEAD:master
