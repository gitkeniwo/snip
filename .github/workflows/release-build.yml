name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      obs_only:
        description: Submit the current version to OBS without publishing a release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  version:
    name: Resolve release version
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.obs_only && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.check.outputs.crate }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: check
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          crate="$(echo "$metadata" | jq -r '.packages[0].name')"
          version="$(echo "$metadata" | jq -r '.packages[0].version')"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $version"
              exit 1
            fi
            echo "Publishing $crate $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Submitting current $crate $version sources to OBS only." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.asset }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: snip-x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            asset: snip-aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            asset: snip-x86_64-unknown-linux-musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            asset: snip-aarch64-unknown-linux-musl
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            asset: snip-aarch64-apple-darwin
          - os: macos-15-intel
            asset: snip-x86_64-apple-darwin
          - os: windows-latest
            asset: snip-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.asset }}
      - name: Install the musl toolchain
        if: matrix.target != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --all-features
        if: matrix.target == ''
      - run: cargo build --locked --release --all-features --target ${{ matrix.target }}
        if: matrix.target != ''
      - run: ./target/release/snip --version
        if: runner.os != 'Windows' && matrix.target == ''
      - run: ./target/${{ matrix.target }}/release/snip --version
        if: matrix.target != ''
      - run: .\target\release\snip.exe --version
        if: runner.os == 'Windows'
      - name: Verify the Windows binary uses the static CRT
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\check-windows-crt.ps1 -Executable target\release\snip.exe
      - name: Verify the binary is statically linked
        if: matrix.target != ''
        run: |
          bin="target/${{ matrix.target }}/release/snip"
          # `ldd` gives inconsistent answers for static binaries: some implementations
          # print a message, while others exit nonzero. Accept both, and only reject an
          # actual list of shared-library dependencies.
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "::error::$bin is dynamically linked"
            ldd "$bin"
            exit 1
          fi
      - name: Install Linux package builders
        if: runner.os == 'Linux' && matrix.target == ''
        run: |
          cargo install cargo-deb --version 3.7.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
          # `rpm` is only needed to list the built package back for verification.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm
      - name: Create portable archive (Unix)
        if: runner.os != 'Windows' && matrix.target == ''
        run: |
          stage="$RUNNER_TEMP/snip-archive"
          mkdir -p "$stage/man"
          cp target/release/snip "$stage/snip"
          cp man/*.[157] "$stage/man/"
          cp LICENSE README.md "$stage/"
          tar -C "$stage" -czf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" snip man LICENSE README.md
      - name: Verify portable archive (Unix)
        if: runner.os != 'Windows' && matrix.target == ''
        run: |
          tar -tzf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" > "$RUNNER_TEMP/archive.list"
          grep -qx 'man/snip.1' "$RUNNER_TEMP/archive.list"
          grep -qx 'man/sniplib.5' "$RUNNER_TEMP/archive.list"
          grep -qx 'man/snip-agents.7' "$RUNNER_TEMP/archive.list"
          grep -qx 'LICENSE' "$RUNNER_TEMP/archive.list"
          grep -qx 'README.md' "$RUNNER_TEMP/archive.list"
      - name: Create portable archive (musl)
        if: matrix.target != ''
        run: |
          stage="$RUNNER_TEMP/snip-archive"
          mkdir -p "$stage/man"
          cp target/${{ matrix.target }}/release/snip "$stage/snip"
          cp man/*.[157] "$stage/man/"
          cp LICENSE README.md "$stage/"
          tar -C "$stage" -czf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" snip man LICENSE README.md
      - name: Verify portable archive (musl)
        if: matrix.target != ''
        run: |
          tar -tzf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" > "$RUNNER_TEMP/archive.list"
          grep -qx 'man/snip.1' "$RUNNER_TEMP/archive.list"
          grep -qx 'man/sniplib.5' "$RUNNER_TEMP/archive.list"
          grep -qx 'man/snip-agents.7' "$RUNNER_TEMP/archive.list"
          grep -qx 'LICENSE' "$RUNNER_TEMP/archive.list"
          grep -qx 'README.md' "$RUNNER_TEMP/archive.list"
      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/snip.exe -DestinationPath ${{ matrix.asset }}.zip
      - name: Create Linux packages
        if: runner.os == 'Linux' && matrix.target == ''
        run: |
          cargo deb --no-build --output ${{ matrix.asset }}.deb
          cargo generate-rpm -o ${{ matrix.asset }}.rpm
      - name: Verify Linux packages
        if: runner.os == 'Linux' && matrix.target == ''
        # Both builders use explicit asset lists, so a missing entry is silent.
        run: |
          pages1="$(printf '%s\n' man/*.1 | wc -l)"
          pages5="$(printf '%s\n' man/*.5 | wc -l)"
          pages7="$(printf '%s\n' man/*.7 | wc -l)"
          dpkg-deb -c ${{ matrix.asset }}.deb > "$RUNNER_TEMP/deb.list"
          grep -q ' \./usr/bin/snip$' "$RUNNER_TEMP/deb.list"
          grep -q ' \./usr/share/doc/sniplab/README.md$' "$RUNNER_TEMP/deb.list"
          test "$(grep -c '\./usr/share/man/man1/.*\.1\.gz$' "$RUNNER_TEMP/deb.list")" -eq "$pages1"
          test "$(grep -c '\./usr/share/man/man5/.*\.5\.gz$' "$RUNNER_TEMP/deb.list")" -eq "$pages5"
          test "$(grep -c '\./usr/share/man/man7/.*\.7\.gz$' "$RUNNER_TEMP/deb.list")" -eq "$pages7"
          rpm -qlp ${{ matrix.asset }}.rpm > "$RUNNER_TEMP/rpm.list"
          grep -qx '/usr/bin/snip' "$RUNNER_TEMP/rpm.list"
          grep -qx '/usr/share/doc/sniplab/README.md' "$RUNNER_TEMP/rpm.list"
          test "$(grep -c '^/usr/share/man/man1/.*\.1$' "$RUNNER_TEMP/rpm.list")" -eq "$pages1"
          test "$(grep -c '^/usr/share/man/man5/.*\.5$' "$RUNNER_TEMP/rpm.list")" -eq "$pages5"
          test "$(grep -c '^/usr/share/man/man7/.*\.7$' "$RUNNER_TEMP/rpm.list")" -eq "$pages7"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish Release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PGP_FINGERPRINT: ${{ vars.PGP_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Check release-signing configuration
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          if [ -z "$PGP_PRIVATE_KEY" ] || [ -z "$PGP_PASSPHRASE" ] || [ -z "$PGP_FINGERPRINT" ]; then
            echo "::error::PGP_PRIVATE_KEY, PGP_PASSPHRASE, and PGP_FINGERPRINT must be configured before publishing a release."
            exit 1
          fi
          case "$PGP_FINGERPRINT" in
            *[!0-9A-F]*|'')
              echo "::error::PGP_FINGERPRINT must be an uppercase, whitespace-free fingerprint."
              exit 1
              ;;
          esac
      - name: Create signed source archive
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          archive="sniplab-$VERSION.tar.gz"
          git archive --format=tar --prefix="snip-$VERSION/" "v$VERSION" | gzip -n > "$archive"
          tar -tzf "$archive" | grep -qx "snip-$VERSION/Cargo.toml"

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -m 700 -d "$GNUPGHOME"
          printf '%s' "$PGP_PRIVATE_KEY" | gpg --batch --import
          imported_fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ "$imported_fingerprint" != "$PGP_FINGERPRINT" ]; then
            echo "::error::The imported signing key does not match PGP_FINGERPRINT."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PGP_PASSPHRASE" \
            --local-user "$PGP_FINGERPRINT" --armor --detach-sign "$archive"
          gpg --batch --verify "$archive.asc" "$archive"
      - name: Prepare release assets and checksums
        run: |
          mkdir release-assets
          for file in artifacts/*/*; do
            name="${file##*/}"
            if [ -e "release-assets/$name" ]; then
              echo "::error::duplicate release asset name: $name"
              exit 1
            fi
            cp "$file" "release-assets/$name"
          done
          cp "sniplab-$VERSION.tar.gz" "sniplab-$VERSION.tar.gz.asc" install.sh release-assets/
          (
            cd release-assets
            sha256sum * > SHA256SUMS
          )
      - name: Sign SHA256SUMS
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PGP_PASSPHRASE" \
            --local-user "$PGP_FINGERPRINT" --armor --detach-sign release-assets/SHA256SUMS
          gpg --batch --verify release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true

  nix:
    name: Verify tagged Nix install
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Check Cachix configuration
        id: cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "CACHIX_AUTH_TOKEN is not set; skipping the Cachix push." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cachix/cachix-action@v17
        if: steps.cachix.outputs.ready == 'true'
        with:
          name: snip
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build from the published tag
        run: nix build github:gitkeniwo/snip/${{ github.ref_name }} -L
      - name: Verify the executable
        run: ./result/bin/snip --version

  crates-io:
    name: Publish to crates.io
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CRATE: ${{ needs.version.outputs.crate }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check for a registry token
        id: guard
        env:
          REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code="$(curl -sSL -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          if [ "$code" = "200" ]; then
            echo "$CRATE $VERSION is already on crates.io; nothing to publish." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.ready == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          key: crates-io
      - name: Publish
        if: steps.guard.outputs.ready == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --all-features

  tap:
    name: Update Homebrew tap
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check for a tap token
        id: guard
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          path: artifacts

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          repository: gitkeniwo/homebrew-snip
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Rewrite the formula
        if: steps.guard.outputs.ready == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, sys

          version = os.environ["VERSION"].lstrip("v")
          # The musl archives exist for the install script and for `cargo binstall`
          # on musl hosts. Homebrew, including Linuxbrew, targets glibc, so the
          # formula only ever references the darwin and gnu archives — counting the
          # musl ones here would make the platform check below fail.
          sums = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path("artifacts").rglob("snip-*.tar.gz")
              if "-linux-musl" not in path.name
          }
          if not sums:
              sys.exit("no release archives were downloaded")

          formula = pathlib.Path("tap/Formula/snip.rb")
          text = re.sub(
              r"/releases/download/v[^/]+/",
              f"/releases/download/v{version}/",
              formula.read_text(),
          )

          missing = []

          def swap(match):
              asset = match.group("asset")
              if asset not in sums:
                  missing.append(asset)
                  return match.group(0)
              return match.group(1) + sums[asset] + match.group(3)

          text, count = re.subn(
              r'(url "[^"]*/(?P<asset>snip-[^"/]+\.tar\.gz)"\n\s*sha256 ")'
              r'[0-9a-f]{64}(")',
              swap,
              text,
          )

          if missing:
              sys.exit("no release archive for: " + ", ".join(missing))
          if count != len(sums):
              sys.exit(f"rewrote {count} platforms but built {len(sums)} archives")

          formula.write_text(text)
          print(f"updated {count} platforms to {version}")
          PY

      - name: Commit and push
        if: steps.guard.outputs.ready == 'true'
        working-directory: tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "Formula was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "snip ${VERSION#v}"
          git push

  scoop:
    name: Update Scoop bucket
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check for a bucket token
        id: guard
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$BUCKET_TOKEN" ]; then
            echo "SCOOP_BUCKET_TOKEN is not set; skipping the Scoop bucket update." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/download-artifact@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          name: snip-x86_64-pc-windows-msvc
          path: artifacts

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          repository: gitkeniwo/scoop-snip
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket-repo

      - name: Render the manifest
        if: steps.guard.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          version = os.environ["VERSION"]
          archive = Path("artifacts/snip-x86_64-pc-windows-msvc.zip")
          if not archive.is_file():
              sys.exit(f"{archive} was not downloaded")

          manifest = Path("packaging/scoop/snip.json.in").read_text()
          manifest = manifest.replace("@VERSION@", version)
          manifest = manifest.replace(
              "@SHA256@", hashlib.sha256(archive.read_bytes()).hexdigest()
          )

          # Parse before writing so a malformed template fails the release
          # rather than shipping a manifest Scoop cannot read.
          json.loads(manifest)

          out = Path("bucket-repo/bucket/snip.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(manifest)
          print(f"rendered snip.json for {version}")
          PY

      - name: Commit and push
        if: steps.guard.outputs.ready == 'true'
        working-directory: bucket-repo
        run: |
          git add bucket/snip.json
          if git diff --cached --quiet; then
            echo "Scoop manifest was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "snip release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "snip $VERSION"
          git push

  gentoo:
    name: Update Gentoo overlay
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check for an overlay token
        id: guard
        env:
          OVERLAY_TOKEN: ${{ secrets.GENTOO_OVERLAY_TOKEN }}
        run: |
          if [ -z "$OVERLAY_TOKEN" ]; then
            echo "GENTOO_OVERLAY_TOKEN is not set; skipping the Gentoo overlay update." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/download-artifact@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          name: snip-x86_64-unknown-linux-musl
          path: artifacts

      - uses: actions/download-artifact@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          name: snip-aarch64-unknown-linux-musl
          path: artifacts

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          repository: gitkeniwo/gentoo-snip-overlay
          token: ${{ secrets.GENTOO_OVERLAY_TOKEN }}
          path: overlay-repo

      - name: Render ebuild, metadata, and Manifest
        if: steps.guard.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          version = os.environ["VERSION"]
          if not re.fullmatch(r"\d+(?:\.\d+)*", version):
              sys.exit(
                  f"{version!r} is not a supported Gentoo PV; "
                  "expected a dot-separated numeric release version"
              )

          root = Path("overlay-repo")
          pkg = root / "app-misc" / "sniplab-bin"
          pkg.mkdir(parents=True, exist_ok=True)

          archives = {
              f"snip-{version}-amd64.tar.gz": Path(
                  "artifacts/snip-x86_64-unknown-linux-musl.tar.gz"
              ),
              f"snip-{version}-arm64.tar.gz": Path(
                  "artifacts/snip-aarch64-unknown-linux-musl.tar.gz"
              ),
          }
          for name, path in archives.items():
              if not path.is_file():
                  sys.exit(f"{path} was not downloaded")

          # Overlay baseline files (idempotent; safe on every release).
          (root / "metadata").mkdir(parents=True, exist_ok=True)
          (root / "profiles").mkdir(parents=True, exist_ok=True)
          (root / "metadata" / "layout.conf").write_text(
              Path("packaging/gentoo/layout.conf.in").read_text()
          )
          (root / "profiles" / "repo_name").write_text("snip\n")
          (root / "profiles" / "eapi").write_text("8\n")

          ebuild = Path("packaging/gentoo/ebuild-bin.in").read_text()
          # No @VERSION@ placeholders in the ebuild; PV comes from the filename.
          ebuild_path = pkg / f"sniplab-bin-{version}.ebuild"
          ebuild_path.write_text(ebuild)
          subprocess.run(["bash", "-n", ebuild_path], check=True)

          metadata = Path("packaging/gentoo/metadata.xml.in").read_text()
          ET.fromstring(metadata)
          (pkg / "metadata.xml").write_text(metadata)

          # Thin Manifest: keep DIST lines for other versions, replace this one.
          manifest_path = pkg / "Manifest"
          kept = []
          if manifest_path.is_file():
              drop = set(archives)
              for line in manifest_path.read_text().splitlines():
                  parts = line.split()
                  if len(parts) >= 2 and parts[0] == "DIST" and parts[1] in drop:
                      continue
                  if line.strip():
                      kept.append(line.rstrip())

          def dist_line(name: str, path: Path) -> str:
              data = path.read_bytes()
              blake = hashlib.blake2b(data, digest_size=64).hexdigest()
              sha = hashlib.sha512(data).hexdigest()
              return f"DIST {name} {len(data)} BLAKE2B {blake} SHA512 {sha}"

          new_lines = [dist_line(name, path) for name, path in archives.items()]
          lines = sorted(kept + new_lines)
          manifest_path.write_text("\n".join(lines) + "\n")
          print(f"rendered app-misc/sniplab-bin for {version}")
          for line in new_lines:
              print(line.split()[0], line.split()[1], line.split()[2])
          PY

      - name: Commit and push
        if: steps.guard.outputs.ready == 'true'
        working-directory: overlay-repo
        run: |
          git add metadata profiles app-misc/sniplab-bin
          if git diff --cached --quiet; then
            echo "Gentoo overlay was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "snip release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "app-misc/sniplab-bin: add $VERSION"
          git push

  aur:
    name: Update AUR package (${{ matrix.package }})
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sniplab
            template: packaging/aur/PKGBUILD.in
          - package: sniplab-bin
            template: packaging/aur/PKGBUILD-bin.in
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PGP_FINGERPRINT: ${{ vars.PGP_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for an AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set; cannot publish to the AUR."
            exit 1
          fi

      - name: Configure SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone the AUR repository
        env:
          AUR_PACKAGE: ${{ matrix.package }}
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          if ! git clone ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git aur 2>"$RUNNER_TEMP/aur-clone.err"; then
            # AUR auto-creates a package on the first push to its git URL. For
            # a brand-new package name the repo does not exist yet, so seed one;
            # the Render step has already validated the PKGBUILD, and the push
            # below creates the package.
            grep -iE 'does not appear|not exist|repository' "$RUNNER_TEMP/aur-clone.err" | head -3 || true
            mkdir aur
            git -C aur init -b master
          fi

      - name: Render PKGBUILD and .SRCINFO
        env:
          AUR_PACKAGE: ${{ matrix.package }}
          TEMPLATE: ${{ matrix.template }}
          SOURCE_URL: https://github.com/gitkeniwo/snip/releases/download/v${{ needs.version.outputs.version }}/sniplab-${{ needs.version.outputs.version }}.tar.gz
        run: |
          if [ "$AUR_PACKAGE" = "sniplab" ]; then
            if [ -z "$PGP_FINGERPRINT" ]; then
              echo "::error::PGP_FINGERPRINT must be configured before updating the AUR package."
              exit 1
            fi
            curl --fail --location --retry 3 --output source.tar.gz "$SOURCE_URL"
            export SHA256="$(sha256sum source.tar.gz | cut -d ' ' -f 1)"
          else
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
              curl --fail --location --retry 3 --output "snip-$target.tar.gz" \
                "https://github.com/gitkeniwo/snip/releases/download/v$VERSION/snip-$target.tar.gz"
            done
            export SHA256_X86_64="$(sha256sum snip-x86_64-unknown-linux-gnu.tar.gz | cut -d ' ' -f 1)"
            export SHA256_AARCH64="$(sha256sum snip-aarch64-unknown-linux-gnu.tar.gz | cut -d ' ' -f 1)"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          package = Path(os.environ["TEMPLATE"]).read_text()
          package = package.replace("@VERSION@", os.environ["VERSION"])
          package = package.replace("@SHA256@", os.environ.get("SHA256", ""))
          package = package.replace("@SHA256_X86_64@", os.environ.get("SHA256_X86_64", ""))
          package = package.replace("@SHA256_AARCH64@", os.environ.get("SHA256_AARCH64", ""))
          package = package.replace("@PGP_FINGERPRINT@", os.environ.get("PGP_FINGERPRINT", ""))
          Path("aur/PKGBUILD").write_text(package)
          PY
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD/aur:/pkg" \
            --workdir /pkg \
            archlinux:base-devel \
            bash -lc 'makepkg --printsrcinfo' > aur/.SRCINFO

      - name: Commit and push
        working-directory: aur
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "snip release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "snip $VERSION"
          git push origin HEAD:master

  copr:
    name: Build in Fedora Copr
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: fedora:latest
    env:
      COPR_PROJECT: gitkeniwo/snip
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check for a Copr API token
        id: guard
        env:
          COPR_API_CONFIG: ${{ secrets.COPR_API_CONFIG }}
        run: |
          if [ -z "$COPR_API_CONFIG" ]; then
            echo "COPR_API_CONFIG is not set; skipping the Copr build." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tooling
        if: steps.guard.outputs.ready == 'true'
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            copr-cli rpm-build rpmdevtools cargo git-core tar

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'

      - name: Vendor the crate dependencies
        if: steps.guard.outputs.ready == 'true'
        env:
          SOURCE_URL: https://github.com/gitkeniwo/snip/releases/download/v${{ needs.version.outputs.version }}/sniplab-${{ needs.version.outputs.version }}.tar.gz
        run: |
          rpmdev-setuptree
          sources=~/rpmbuild/SOURCES
          curl --fail --location --retry 3 \
            --output "$sources/sniplab-$VERSION.tar.gz" "$SOURCE_URL"

          # Copr builds run in mock without network access, so the dependencies
          # ship in the SRPM. Vendor from the release archive rather than this
          # checkout, so the tree matches what the spec unpacks.
          workdir="$(mktemp -d)"
          tar -C "$workdir" -xzf "$sources/sniplab-$VERSION.tar.gz"
          ( cd "$workdir/snip-$VERSION" && cargo vendor --locked vendor )
          tar -C "$workdir/snip-$VERSION" -czf \
            "$sources/sniplab-$VERSION-vendor.tar.gz" vendor

      - name: Render the spec
        if: steps.guard.outputs.ready == 'true'
        run: |
          DATE="$(LC_ALL=C date -u '+%a %b %d %Y')" python3 - <<'PY'
          import os
          from pathlib import Path

          spec = Path("packaging/copr/sniplab.spec.in").read_text()
          spec = spec.replace("@VERSION@", os.environ["VERSION"])
          spec = spec.replace("@DATE@", os.environ["DATE"])
          out = Path.home() / "rpmbuild" / "SPECS" / "sniplab.spec"
          out.write_text(spec)
          PY

      - name: Build the SRPM
        if: steps.guard.outputs.ready == 'true'
        run: rpmbuild -bs ~/rpmbuild/SPECS/sniplab.spec

      - name: Submit to Copr
        if: steps.guard.outputs.ready == 'true'
        env:
          COPR_API_CONFIG: ${{ secrets.COPR_API_CONFIG }}
        run: |
          install -m 700 -d ~/.config
          printf '%s\n' "$COPR_API_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          srpm="$(ls ~/rpmbuild/SRPMS/sniplab-$VERSION-*.src.rpm)"
          copr-cli build "$COPR_PROJECT" "$srpm"
          echo "Submitted $(basename "$srpm") to $COPR_PROJECT" \
            >> "$GITHUB_STEP_SUMMARY"

  obs:
    name: Submit to Open Build Service
    needs: [version, publish]
    if: >-
      always() && needs.version.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') &&
      needs.publish.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.obs_only &&
      github.ref == 'refs/heads/main' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OBS_API: https://api.opensuse.org
      OBS_PROJECT: home:gitkeniwo
      OBS_PACKAGE: sniplab
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check for an osc configuration
        id: guard
        env:
          OSC_CONFIG: ${{ secrets.OSC_CONFIG }}
        run: |
          if [ -z "$OSC_CONFIG" ]; then
            echo "OSC_CONFIG is not set; skipping the OBS submission." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OBS tooling
        if: steps.guard.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends osc

      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'

      - name: Prepare offline OBS sources
        if: steps.guard.outputs.ready == 'true'
        run: |
          output_dir="$RUNNER_TEMP/obs-sources"
          packaging/obs/prepare-sources.sh "$output_dir"
          test -s "$output_dir/sniplab-$VERSION.tar.gz"
          test -s "$output_dir/sniplab-$VERSION-vendor.tar.gz"
          test -s "$output_dir/sniplab-$VERSION-obs.tar.gz"

      - name: Configure osc
        if: steps.guard.outputs.ready == 'true'
        env:
          OSC_CONFIG: ${{ secrets.OSC_CONFIG }}
        run: |
          config="$RUNNER_TEMP/oscrc"
          printf '%s\n' "$OSC_CONFIG" > "$config"
          chmod 600 "$config"
          echo "OSC_CONFIG_FILE=$config" >> "$GITHUB_ENV"

      - name: Submit source recipes to OBS
        if: steps.guard.outputs.ready == 'true'
        run: |
          checkout_root="$RUNNER_TEMP/osc-checkout"
          install -d "$checkout_root"
          (
            cd "$checkout_root"
            osc --config "$OSC_CONFIG_FILE" -A "$OBS_API" \
              checkout "$OBS_PROJECT" "$OBS_PACKAGE"
          )

          package_dir="$checkout_root/$OBS_PROJECT/$OBS_PACKAGE"
          test -d "$package_dir/.osc"
          find "$package_dir" -mindepth 1 -maxdepth 1 ! -name .osc \
            -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/obs-sources/." "$package_dir/"

          (
            cd "$package_dir"
            osc --config "$OSC_CONFIG_FILE" addremove
            if [ -z "$(osc --config "$OSC_CONFIG_FILE" status)" ]; then
              echo "OBS package was already up to date." >> "$GITHUB_STEP_SUMMARY"
            else
              osc --config "$OSC_CONFIG_FILE" commit \
                -m "sniplab $VERSION"
              echo "Submitted sniplab $VERSION to $OBS_PROJECT/$OBS_PACKAGE." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          )
