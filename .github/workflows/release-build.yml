name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: snip-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: snip-aarch64-unknown-linux-gnu
          - os: macos-latest
            asset: snip-aarch64-apple-darwin
          - os: macos-15-intel
            asset: snip-x86_64-apple-darwin
          - os: windows-latest
            asset: snip-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.asset }}
      - run: cargo build --locked --release --all-features
      - run: ./target/release/snip --version
        if: runner.os != 'Windows'
      - run: .\target\release\snip.exe --version
        if: runner.os == 'Windows'
      - name: Create portable archive (Unix)
        if: runner.os != 'Windows'
        run: tar -C target/release -czf ${{ matrix.asset }}.tar.gz snip
      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/snip.exe -DestinationPath ${{ matrix.asset }}.zip
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*.tar.gz
            artifacts/*/*.zip
          generate_release_notes: true
