[package]
name = "sniplab"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
description = "A filesystem-native snippet library and agent-friendly CLI, installed as `snip`"
license = "MIT"
readme = "README.md"
repository = "https://github.com/gitkeniwo/snip"
homepage = "https://github.com/gitkeniwo/snip"
documentation = "https://docs.rs/sniplab"
keywords = ["snippet", "cli", "tui", "notes", "ratatui"]
categories = ["command-line-utilities", "development-tools", "text-editors"]
exclude = [
    ".github/",
    "assets/base16/",
    "examples/",
    "opencode.jsonc",
]

[lib]
name = "snip"
path = "src/lib.rs"

[[bin]]
name = "snip"
path = "src/main.rs"

# `cargo binstall sniplab` looks up the prebuilt archives published by the
# release workflow.  The crate is named `sniplab`, but the user-facing binary
# and archive prefix are `snip`, so the default artifact-name discovery would
# not find these files.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/snip-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/snip-{ target }.zip"
pkg-fmt = "zip"

# Both Linux package builders use explicit asset lists so the executable and
# generated manual pages stay in sync.
[package.metadata.deb]
assets = [
    ["target/release/snip", "usr/bin/", "755"],
    ["man/*.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/sniplab/README.md", "644"],
]

[package.metadata.generate-rpm]

[[package.metadata.generate-rpm.assets]]
source = "target/release/snip"
dest = "/usr/bin/snip"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "man/*.1"
dest = "/usr/share/man/man1/"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/sniplab/LICENSE"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/sniplab/README.md"
mode = "0644"
doc = true

[features]
default = ["tui"]
tui = [
    "dep:notify",
    "dep:notify-debouncer-mini",
    "dep:nucleo-matcher",
    "dep:ratatui",
]

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
fs2 = "0.4"
plist = "1.10"
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
syntect = { version = "5.3", default-features = false, features = ["default-themes", "html"] }
tempfile = "3.23"
thiserror = "2.0"
time = { version = "0.3.54", features = ["formatting", "local-offset", "parsing"] }
toml = "1.0"
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
arboard = { version = "3.6.1", default-features = false }
notify = { version = "8.2", optional = true }
notify-debouncer-mini = { version = "0.7", optional = true }
nucleo-matcher = { version = "0.3.1", optional = true }
ratatui = { version = "0.30.2", optional = true }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }

[dev-dependencies]
assert_cmd = "2.1"
clap_mangen = "0.3"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
